<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Quran Listener</title>
    <meta name="description" content="Listen to the Quran with synchronized verse text on a calm black canvas." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quran" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'KFGQPC Uthmanic Hafs';
        src: url('./fonts/UthmanicHafs.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      html, body, #root {
        background-color: #000;
        height: 100%;
        overscroll-behavior: none;
      }
      body {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body style="background-color:#000;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
